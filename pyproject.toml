[project]
name = "tusker-nuclei"
version = "0.6.2"
description = "A PostgreSQL specific migration tool"
readme = "README.md"
license = { text = "Unlicense" }
authors = [
    { name = "Henry Jones", email = "hjones@proofpoint.com" },
    { name = "Michael P. Jung", email = "michael.jung@terreon.de" },
]
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Development Status :: 4 - Beta",
    "Topic :: Database",
    "Topic :: Utilities",
]
dependencies = [
    "importlib-metadata>=1.0,<2.0; python_version < '3.8'",
    "migra>=3.0.1621480950,<4.0",
    "tomlkit>=0.11,<0.12",
    "sqlalchemy>=1.4.25,<2.0",
    "psycopg2>=2.9.5,<3.0",
    "setuptools<81",
]

[project.urls]
Homepage = "https://github.com/NucleiAI/tusker-python-legacy"
Repository = "https://github.com/NucleiAI/tusker-python-legacy"

[project.scripts]
tusker = "tusker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tusker"]
